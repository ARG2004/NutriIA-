name: iosApp
options:
  bundleIdPrefix: com.arg
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 10.29.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    branch: latest # Rama oficial con soporte Metal

targets:
  NutriIA:
    type: application
    platform: iOS
    deploymentTarget: '15.0'
    sources:
      - path: iosApp/iosApp
        excludes:
          - '*.png'
          - '*.webp'
          - Info.plist
          - compose-resources
    resources:
      - path: iosApp/iosApp/GoogleService-Info.plist
    info:
      path: iosApp/iosApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        CFBundleExecutable: NutriIA
        CFBundleIdentifier: com.arg.nutriia
        CFBundleInfoDictionaryVersion: '6.0'
        CFBundleName: NutriIA
        CFBundlePackageType: APPL
        CFBundleShortVersionString: '2.4.4'
        CFBundleVersion: '186'
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.arg.nutriia
            CFBundleURLSchemes:
              - nutriia
        LSRequiresIPhoneOS: true
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchStoryboardName: LaunchScreen
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "NutrIA necesita acceso a la red local para mejorar la calidad de las teleconsultas en casa"
        NSSpeechRecognitionUsageDescription: "NutrIA utiliza el reconocimiento de voz para facilitar la accesibilidad y dictado de información médica y nutricional."
        NSMicrophoneUsageDescription: "NutrIA utiliza el micrófono para las teleconsultas y la interacción por voz."
        NSCameraUsageDescription: "NutrIA utiliza la cámara para la teleconsulta y el análisis visual de alimentos."
        NSPhotoLibraryUsageDescription: "NutrIA utiliza la galería para adjuntar fotos a tu expediente nutricional."
        NSFaceIDUsageDescription: "NutrIA utiliza Face ID para un inicio de sesión rápido y seguro."
        NSLocationWhenInUseUsageDescription: "NutrIA utiliza tu ubicación para sugerirte especialistas y servicios cercanos."
        NSBluetoothAlwaysUsageDescription: "NutrIA utiliza Bluetooth para conectarse a dispositivos y básculas inteligentes."
        NSBluetoothPeripheralUsageDescription: "NutrIA utiliza Bluetooth para comunicarse con dispositivos cercanos de salud."
        NSCalendarsUsageDescription: "NutrIA utiliza el calendario para agendar y recordarte tus citas médicas."
        NSCalendarsFullAccessUsageDescription: "NutrIA necesita acceso completo al calendario para insertar y gestionar tus planes de alimentación y citas médicas."
        NSCalendarsWriteOnlyAccessUsageDescription: "NutrIA necesita permiso para añadir eventos de alimentación y citas médicas a tu calendario."
        GROQ_API_KEY: "$(GROQ_API_KEY)"
    capabilities:
      - com.apple.developer.usernotifications
      - com.apple.developer.aps-environment
    settings:
      configFiles:
        Debug: iosApp/Config.xcconfig
        Release: iosApp/Config.xcconfig
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arg.nutriia
        DEVELOPMENT_TEAM: X423NH338U
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "NutriIA Profile"
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/iosApp/Info.plist
        CURRENT_PROJECT_VERSION: '186'
        MARKETING_VERSION: '2.4.4'
        FRAMEWORK_SEARCH_PATHS: '$(SRCROOT)/shared/build/bin/iosArm64/releaseFramework'
        LD_RUNPATH_SEARCH_PATHS: '@executable_path/Frameworks'
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: WebRTC
        product: WebRTC
      - framework: shared/build/bin/iosArm64/releaseFramework/Shared.framework
        embed: false




