name: iosApp
options:
  bundleIdPrefix: com.arg
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 10.29.0

targets:
  NutriIA:
    type: application
    platform: iOS
    deploymentTarget: '15.0'
    sources:
      - path: iosApp/iosApp
        excludes:
          - '*.png'
          - Info.plist
    info:
      path: iosApp/iosApp/Info.plist
      properties:
        CFBundleShortVersionString: '2.2.7'
        CFBundleVersion: '51'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arg.nutriia
        DEVELOPMENT_TEAM: X423NH338U
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "NutriIA Profile"
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/iosApp/Info.plist
        CURRENT_PROJECT_VERSION: '51'
        MARKETING_VERSION: '2.2.7'
        FRAMEWORK_SEARCH_PATHS: '$(SRCROOT)/shared/build/bin/iosArm64/releaseFramework'
        LD_RUNPATH_SEARCH_PATHS: '@executable_path/Frameworks'
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - framework: shared/build/bin/iosArm64/releaseFramework/Shared.framework
        embed: false
