name: NutrIA Cloud Build & iOS Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify NutrIA (Android & iOS Cloud Pipeline)
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Grant Execute Permissions for Gradle
        run: chmod +x gradlew

      - name: 4. Build Android Debug APK (Sanity Check)
        run: ./gradlew assembleDebug --stacktrace

      - name: 5. Setup Apple Certificates & Keychains (If Configured)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MI_CERTIFICADO_APPLE }}
          P12_PASSWORD: ${{ secrets.MI_CLAVE_CERTIFICADO }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MI_PERFIL_NUTRIIA || secrets.MI_PERFIL_NUTRIA }}
          KEYCHAIN_PASSWORD: ${{ secrets.MI_CLAVE_KEYCHAIN }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No se detectó MI_CERTIFICADO_APPLE; omitiendo configuración de firma."
          else
            echo "Configurando llavero de seguridad e importando certificados oficiales de Apple..."
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"') || true
            security default-keychain -s $KEYCHAIN_PATH || true

            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode -o $CERTIFICATE_PATH 2>/dev/null || echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 -D -o $CERTIFICATE_PATH 2>/dev/null || echo "$BUILD_CERTIFICATE_BASE64" | base64 -d -o $CERTIFICATE_PATH 2>/dev/null || true
            echo "Tamaño del certificado p12 decodificado: $(wc -c < $CERTIFICATE_PATH) bytes."

            echo "Importando certificado en llavero de seguridad..."
            security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security || security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A || true
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A 2>/dev/null || true
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true

            echo "=== IDENTIDADES DE FIRMA DISPONIBLES EN KEYCHAIN ==="
            security find-identity -v $KEYCHAIN_PATH || true
            security find-identity -v || true

            PP_PATH=$RUNNER_TEMP/downloaded_profile.mobileprovision
            echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode -o $PP_PATH 2>/dev/null || echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 -D -o $PP_PATH 2>/dev/null || true
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          fi

      - name: 6. Setup App Store Connect API Key (If Configured)
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          if [ -z "$APPSTORE_PRIVATE_KEY_BASE64" ]; then
            echo "No se detectó APPSTORE_PRIVATE_KEY; omitiendo configuración de API Key."
          else
            echo "Configurando clave API de App Store Connect para despliegue en TestFlight..."
            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            echo "$APPSTORE_PRIVATE_KEY_BASE64" | tr -d '\r\n ' | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 2>/dev/null || echo "$APPSTORE_PRIVATE_KEY_BASE64" | tr -d '\r\n ' | base64 -D -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 2>/dev/null || true
            echo "$APPSTORE_PRIVATE_KEY_BASE64" | tr -d '\r\n ' | base64 --decode -o ~/.private_keys/AuthKey_${KEY_ID}.p8 2>/dev/null || echo "$APPSTORE_PRIVATE_KEY_BASE64" | tr -d '\r\n ' | base64 -D -o ~/.private_keys/AuthKey_${KEY_ID}.p8 2>/dev/null || true
          fi

      - name: 7. Build iOS Multiplatform Framework
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode --stacktrace || ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: 8. Package & Upload iOS IPA to TestFlight (If Configured)
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MI_PERFIL_NUTRIIA || secrets.MI_PERFIL_NUTRIA }}
        run: |
          if [ -z "$APPSTORE_PRIVATE_KEY_BASE64" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "Secretos de App Store Connect no configurados completamente; omitiendo envío automático a TestFlight."
          else
            echo "Empaquetando ejecutable .ipa para iOS y enviando a TestFlight..."
            mkdir -p build/Payload
            FRAMEWORK_DIR=$(find shared/build/bin -name "*.framework" | head -n 1)
            
            if [ -n "$FRAMEWORK_DIR" ]; then
              mkdir -p build/Payload/NutriIA.app
              if [ -f "iosApp/iosApp/Info.plist" ]; then
                cp iosApp/iosApp/Info.plist build/Payload/NutriIA.app/Info.plist
              fi
              if [ -d "iosApp/iosApp/Assets.xcassets" ]; then
                xcrun actool iosApp/iosApp/Assets.xcassets --compile build/Payload/NutriIA.app --platform iphoneos --minimum-deployment-target 15.0 --app-icon AppIcon --output-format human-readable-text || true
              fi
              if [ -f "iosApp/iosApp/AppIcon.png" ]; then
                cp iosApp/iosApp/*.png build/Payload/NutriIA.app/ 2>/dev/null || true
              fi

              # Compilar ejecutable binario nativo de iOS (Mach-O arm64)
              xcrun -sdk iphoneos swiftc -target arm64-apple-ios15.0 -parse-as-library \
                iosApp/iosApp/iOSApp.swift \
                -F shared/build/bin/iosArm64/releaseFramework \
                -framework Shared \
                -framework SwiftUI \
                -framework UIKit \
                -framework Foundation \
                -Xlinker -rpath -Xlinker @executable_path/Frameworks \
                -o build/Payload/NutriIA.app/NutriIA

              chmod +x build/Payload/NutriIA.app/NutriIA
              echo "Ejecutable binario creado con éxito ($(wc -c < build/Payload/NutriIA.app/NutriIA) bytes)."

              # Garantizar incrustación de embedded.mobileprovision en el paquete
              PP_PATH="build/Payload/NutriIA.app/embedded.mobileprovision"
              if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
                echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode -o "$PP_PATH" 2>/dev/null || echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 -D -o "$PP_PATH" 2>/dev/null || true
                echo "embedded.mobileprovision generado con éxito ($(wc -c < "$PP_PATH") bytes)."
              fi

              # Extraer entitlements de embedded.mobileprovision para firma de producción
              if [ -f "$PP_PATH" ]; then
                security cms -D -i "$PP_PATH" > build/Payload/provision.plist 2>/dev/null || true
                /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' build/Payload/provision.plist > build/Payload/entitlements.plist 2>/dev/null || true
                plutil -convert xml1 build/Payload/entitlements.plist 2>/dev/null || true
                echo "Entitlements extraídos del perfil de provisión."
              fi

              # Firmar binario nativo y frameworks con certificado oficial de Apple
              KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
              IDENTITY=$(security find-identity -v $KEYCHAIN_PATH 2>/dev/null | grep -i "Apple Distribution" | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
              if [ -z "$IDENTITY" ]; then
                IDENTITY=$(security find-identity -v 2>/dev/null | grep -i "Apple Distribution" | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
              fi
              if [ -z "$IDENTITY" ]; then
                IDENTITY=$(security find-identity -v $KEYCHAIN_PATH 2>/dev/null | grep -v "0 valid identities found" | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
              fi
              if [ -z "$IDENTITY" ]; then
                IDENTITY=$(security find-identity -v 2>/dev/null | grep -v "0 valid identities found" | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
              fi

              echo "Identidad de firma seleccionada: '$IDENTITY'"

              if [ -n "$IDENTITY" ]; then
                echo "Firmando app con certificado oficial de Apple: $IDENTITY"
                codesign --force --deep --options runtime -s "$IDENTITY" build/Payload/NutriIA.app/Frameworks/Shared.framework 2>/dev/null || true
                if [ -f "build/Payload/entitlements.plist" ]; then
                  codesign --force --deep --options runtime --entitlements build/Payload/entitlements.plist -s "$IDENTITY" build/Payload/NutriIA.app || codesign --force --deep --options runtime -s "$IDENTITY" build/Payload/NutriIA.app
                else
                  codesign --force --deep --options runtime -s "$IDENTITY" build/Payload/NutriIA.app
                fi
              else
                echo "ADVERTENCIA: Firmando ad-hoc."
                codesign --force --deep -s - build/Payload/NutriIA.app || true
              fi

              cd build
              zip -r NutriIA.ipa Payload
              cd ..
              
              IPA_PATH="build/NutriIA.ipa"
              echo "Subiendo $IPA_PATH a App Store Connect / TestFlight con clave $KEY_ID e Issuer $ISSUER_ID..."
              xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --verbose || echo "Comando de subida finalizado."
            else
              echo "No se encontró el framework de iOS para empaquetar."
            fi
          fi

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutrIA-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 10. Upload iOS Framework & IPA Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: NutrIA-iOS-Artifacts
          path: |
            build/*.ipa
            *.ipa
            shared/build/bin/iosArm64/releaseFramework/
            shared/build/bin/
          if-no-files-found: ignore
