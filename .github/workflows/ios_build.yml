name: NutrIA Cloud Build & iOS Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify NutrIA (Android & iOS Cloud Pipeline)
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Grant Execute Permissions for Gradle
        run: chmod +x gradlew

      - name: 4. Build Android Debug APK (Sanity Check)
        run: ./gradlew assembleDebug --stacktrace

      - name: 5. Setup Apple Certificates & Keychains (If Configured)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MI_CERTIFICADO_APPLE }}
          P12_PASSWORD: ${{ secrets.MI_CLAVE_CERTIFICADO }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MI_PERFIL_NUTRIIA || secrets.MI_PERFIL_NUTRIA }}
          KEYCHAIN_PASSWORD: ${{ secrets.MI_CLAVE_KEYCHAIN }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No se detectó MI_CERTIFICADO_APPLE; omitiendo configuración de firma."
          else
            echo "Configurando llavero de seguridad e importando certificados oficiales de Apple..."
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"') || true
            security default-keychain -s $KEYCHAIN_PATH || true

            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode -o $CERTIFICATE_PATH 2>/dev/null || echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 -D -o $CERTIFICATE_PATH 2>/dev/null || echo "$BUILD_CERTIFICATE_BASE64" | base64 -d -o $CERTIFICATE_PATH 2>/dev/null || true
            echo "Tamaño del certificado p12 decodificado: $(wc -c < $CERTIFICATE_PATH) bytes."

            echo "Importando certificado en llavero de seguridad..."
            security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security || security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A || true
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A 2>/dev/null || true
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true

            echo "=== IDENTIDADES DE FIRMA DISPONIBLES EN KEYCHAIN ==="
            security find-identity -v $KEYCHAIN_PATH || true
            security find-identity -v || true

            PP_PATH=$RUNNER_TEMP/downloaded_profile.mobileprovision
            echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode -o $PP_PATH 2>/dev/null || echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 -D -o $PP_PATH 2>/dev/null || true
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          fi

      - name: 6. Setup App Store Connect API Key (If Configured)
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          if [ -z "$APPSTORE_PRIVATE_KEY_BASE64" ]; then
            echo "No se detectó APPSTORE_PRIVATE_KEY; omitiendo configuración de API Key."
          else
            echo "Configurando clave API de App Store Connect..."
            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            echo "$APPSTORE_PRIVATE_KEY_BASE64" | tr -d '\r\n ' | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 2>/dev/null || true
          fi

      - name: 7. Build iOS Multiplatform Framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC" -DKONAN_ARCH=arm64

      - name: 8. Generate and Validate iOS Project (No Signing)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew install xcodegen
          if [ ! -f iosApp/Config.xcconfig ]; then
            echo "GROQ_API_KEY = ${GROQ_API_KEY:-}" > iosApp/Config.xcconfig
          fi
          xcodegen generate

      - name: 9. Build and Validate iOS Project (No Signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme NutriIA \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log || (echo "=== ERRORES DETALLADOS DE COMPILACION ===" && grep -C 3 -E "error:|fatal error:" /tmp/xcodebuild.log && exit 1)

      - name: 10. Package & Upload iOS IPA to TestFlight (If Configured)
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.MI_CLAVE_KEYCHAIN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$APPSTORE_PRIVATE_KEY_BASE64" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "AVISO: faltan APPSTORE_PRIVATE_KEY, APPSTORE_KEY_ID o APPSTORE_ISSUER_ID; se omitirá el envío a TestFlight."
            echo "El paso 8 solo valida la compilación; para publicar el IPA configura esos secretos y los secretos de firma Apple."
          else
            brew install xcodegen
            if [ ! -f iosApp/Config.xcconfig ]; then
              echo "GROQ_API_KEY = ${GROQ_API_KEY:-}" > iosApp/Config.xcconfig
            fi
            xcodegen generate

            # Garantizar que todas las cadenas de propósito de privacidad existan en Info.plist tras xcodegen
            /usr/libexec/PlistBuddy -c 'Set :NSSpeechRecognitionUsageDescription "NutrIA utiliza el reconocimiento de voz para facilitar la accesibilidad y dictado de información médica y nutricional."' iosApp/iosApp/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :NSSpeechRecognitionUsageDescription string "NutrIA utiliza el reconocimiento de voz para facilitar la accesibilidad y dictado de información médica y nutricional."' iosApp/iosApp/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Set :NSMicrophoneUsageDescription "NutrIA utiliza el micrófono para las teleconsultas y la interacción por voz."' iosApp/iosApp/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :NSMicrophoneUsageDescription string "NutrIA utiliza el micrófono para las teleconsultas y la interacción por voz."' iosApp/iosApp/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Set :NSCameraUsageDescription "NutrIA utiliza la cámara para la teleconsulta y el análisis visual de alimentos."' iosApp/iosApp/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :NSCameraUsageDescription string "NutrIA utiliza la cámara para la teleconsulta y el análisis visual de alimentos."' iosApp/iosApp/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Set :NSPhotoLibraryUsageDescription "NutrIA utiliza la galería para adjuntar fotos a tu expediente nutricional."' iosApp/iosApp/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :NSPhotoLibraryUsageDescription string "NutrIA utiliza la galería para adjuntar fotos a tu expediente nutricional."' iosApp/iosApp/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Set :NSFaceIDUsageDescription "NutrIA utiliza Face ID para un inicio de sesión rápido y seguro."' iosApp/iosApp/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :NSFaceIDUsageDescription string "NutrIA utiliza Face ID para un inicio de sesión rápido y seguro."' iosApp/iosApp/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Set :ITSAppUsesNonExemptEncryption false' iosApp/iosApp/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' iosApp/iosApp/Info.plist 2>/dev/null || true

            IDENTITY=$(security find-identity -v | grep -E "Apple Distribution|iPhone Distribution" | grep -o '"[^"]*"' | head -1 | tr -d '"')
            PP_FILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
            security cms -D -i "$PP_FILE" > /tmp/pp_decoded.plist 2>/dev/null
            PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/pp_decoded.plist 2>/dev/null || echo "")

            cp iosApp/exportOptions.plist /tmp/exportOptions.plist
            /usr/libexec/PlistBuddy -c "Set :signingStyle manual" /tmp/exportOptions.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" /tmp/exportOptions.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.arg.nutriia string $PP_UUID" /tmp/exportOptions.plist 2>/dev/null || true

            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            
            BUILD_NUM=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' iosApp/iosApp/Info.plist 2>/dev/null || echo "185")
            MARKETING_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' iosApp/iosApp/Info.plist 2>/dev/null || echo "2.4.4")
            
            xcodebuild archive \
              -project iosApp.xcodeproj \
              -scheme NutriIA \
              -configuration Release \
              -archivePath $RUNNER_TEMP/NutriIA.xcarchive \
              -sdk iphoneos \
              ONLY_ACTIVE_ARCH=NO \
              ARCHS=arm64 \
              MARKETING_VERSION="$MARKETING_VER" \
              CURRENT_PROJECT_VERSION="$BUILD_NUM"

            # Inyectar recursos de Compose Multiplatform directamente en el paquete de la app
            APP_DIR="$RUNNER_TEMP/NutriIA.xcarchive/Products/Applications/NutriIA.app"
            mkdir -p "$APP_DIR/compose-resources/composeResources/com.example.nutriia.resources/drawable" || true
            cp -R shared/src/commonMain/composeResources/drawable/* "$APP_DIR/compose-resources/composeResources/com.example.nutriia.resources/drawable/" 2>/dev/null || true

            xcodebuild -exportArchive \
              -archivePath $RUNNER_TEMP/NutriIA.xcarchive \
              -exportPath $RUNNER_TEMP/ipa-export \
              -exportOptionsPlist /tmp/exportOptions.plist

            IPA_PATH=$(find $RUNNER_TEMP/ipa-export -name "*.ipa" | head -1)
            xcrun altool --upload-app --type ios \
              --file "$IPA_PATH" \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID" \
              --verbose
          fi

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutrIA-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 10. Upload iOS Framework & IPA Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: NutrIA-iOS-Artifacts
          path: |
            ${{ runner.temp }}/ipa-export/*.ipa
            build/*.ipa
            *.ipa
            shared/build/bin/iosArm64/releaseFramework/
            shared/build/bin/
          if-no-files-found: ignore

      - name: 11. Upload iOS App dSYMs (Crash Symbolication)
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: NutriIA-iOS-dSYMs
          path: ${{ runner.temp }}/NutriIA.xcarchive/dSYMs/
          if-no-files-found: warn





