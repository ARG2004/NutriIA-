name: NutrIA Cloud Build & iOS Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify NutrIA (Android & iOS Cloud Pipeline)
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Grant Execute Permissions for Gradle
        run: chmod +x gradlew

      - name: 4. Build Android Debug APK (Sanity Check)
        run: ./gradlew assembleDebug --stacktrace

      - name: 5. Setup Apple Certificates & Keychains (If Configured)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MI_CERTIFICADO_APPLE }}
          P12_PASSWORD: ${{ secrets.MI_CLAVE_CERTIFICADO }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MI_PERFIL_NUTRIIA || secrets.MI_PERFIL_NUTRIA }}
          KEYCHAIN_PASSWORD: ${{ secrets.MI_CLAVE_KEYCHAIN }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No se detectó MI_CERTIFICADO_APPLE; omitiendo configuración de firma."
          else
            echo "Configurando llavero de seguridad e importando certificados oficiales de Apple..."
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"') || true
            security default-keychain -s $KEYCHAIN_PATH || true

            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode -o $CERTIFICATE_PATH 2>/dev/null || echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 -D -o $CERTIFICATE_PATH 2>/dev/null || echo "$BUILD_CERTIFICATE_BASE64" | base64 -d -o $CERTIFICATE_PATH 2>/dev/null || true
            echo "Tamaño del certificado p12 decodificado: $(wc -c < $CERTIFICATE_PATH) bytes."

            echo "Importando certificado en llavero de seguridad..."
            security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security || security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A || true
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A 2>/dev/null || true
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true

            echo "=== IDENTIDADES DE FIRMA DISPONIBLES EN KEYCHAIN ==="
            security find-identity -v $KEYCHAIN_PATH || true
            security find-identity -v || true

            PP_PATH=$RUNNER_TEMP/downloaded_profile.mobileprovision
            echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode -o $PP_PATH 2>/dev/null || echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 -D -o $PP_PATH 2>/dev/null || true
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          fi

      - name: 6. Setup App Store Connect API Key (If Configured)
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          if [ -z "$APPSTORE_PRIVATE_KEY_BASE64" ]; then
            echo "No se detectó APPSTORE_PRIVATE_KEY; omitiendo configuración de API Key."
          else
            echo "Configurando clave API de App Store Connect para despliegue en TestFlight..."
            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            echo "$APPSTORE_PRIVATE_KEY_BASE64" | tr -d '\r\n ' | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 2>/dev/null || echo "$APPSTORE_PRIVATE_KEY_BASE64" | tr -d '\r\n ' | base64 -D -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 2>/dev/null || true
            echo "$APPSTORE_PRIVATE_KEY_BASE64" | tr -d '\r\n ' | base64 --decode -o ~/.private_keys/AuthKey_${KEY_ID}.p8 2>/dev/null || echo "$APPSTORE_PRIVATE_KEY_BASE64" | tr -d '\r\n ' | base64 -D -o ~/.private_keys/AuthKey_${KEY_ID}.p8 2>/dev/null || true
          fi

      - name: 7. Build iOS Multiplatform Framework
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode --stacktrace || ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: 8. Package & Upload iOS IPA to TestFlight (If Configured)
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.MI_CLAVE_KEYCHAIN }}
        run: |
          if [ -z "$APPSTORE_PRIVATE_KEY_BASE64" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "Secretos de App Store Connect no configurados; omitiendo envío a TestFlight."
          else
            echo "Instalando xcodegen para generar proyecto Xcode..."
            brew install xcodegen

            echo "Generando iosApp.xcodeproj desde project.yml..."
            xcodegen generate

            echo "Obteniendo identidad de firma del keychain..."
            IDENTITY=$(security find-identity -v | grep -E "Apple Distribution|iPhone Distribution" | grep -o '"[^"]*"' | head -1 | tr -d '"')
            echo "Identidad: $IDENTITY"

            echo "Obteniendo UUID del perfil de aprovisionamiento instalado..."
            PP_FILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
            security cms -D -i "$PP_FILE" > /tmp/pp_decoded.plist 2>/dev/null
            PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/pp_decoded.plist 2>/dev/null || echo "")
            echo "UUID del perfil: $PP_UUID"

            echo "Preparando exportOptions.plist con firma manual..."
            cp iosApp/exportOptions.plist /tmp/exportOptions.plist
            /usr/libexec/PlistBuddy -c "Set :signingStyle manual" /tmp/exportOptions.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" /tmp/exportOptions.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.arg.nutriia string $PP_UUID" /tmp/exportOptions.plist 2>/dev/null || true

            echo "=== Desbloqueando keychain antes de archivar ==="
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH || true

            echo "=== Archivando con xcodebuild ==="
            xcodebuild archive \
              -project iosApp.xcodeproj \
              -scheme NutriIA \
              -configuration Release \
              -archivePath $RUNNER_TEMP/NutriIA.xcarchive \
              -sdk iphoneos \
              ONLY_ACTIVE_ARCH=NO \
              ARCHS=arm64 \
              MARKETING_VERSION="2.0.0" \
              CURRENT_PROJECT_VERSION="2" \
              CODE_SIGN_IDENTITY="$IDENTITY" \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE="$PP_UUID" \
              DEVELOPMENT_TEAM=X423NH338U

            echo "=== Forzando versión 2.0.0 (build 2) en el xcarchive ==="
            /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleShortVersionString 2.0.0" $RUNNER_TEMP/NutriIA.xcarchive/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:CFBundleShortVersionString string 2.0.0" $RUNNER_TEMP/NutriIA.xcarchive/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion 2" $RUNNER_TEMP/NutriIA.xcarchive/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:CFBundleVersion string 2" $RUNNER_TEMP/NutriIA.xcarchive/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 2.0.0" $RUNNER_TEMP/NutriIA.xcarchive/Products/Applications/NutriIA.app/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 2" $RUNNER_TEMP/NutriIA.xcarchive/Products/Applications/NutriIA.app/Info.plist 2>/dev/null || true

            echo "=== Re-firmando app tras actualizar Plist ==="
            codesign --force --sign "$IDENTITY" --timestamp=none $RUNNER_TEMP/NutriIA.xcarchive/Products/Applications/NutriIA.app || true

            echo "=== Versión dentro del xcarchive ==="
            /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" $RUNNER_TEMP/NutriIA.xcarchive/Info.plist || true
            /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleVersion" $RUNNER_TEMP/NutriIA.xcarchive/Info.plist || true

            echo "=== Exportando IPA ==="
            xcodebuild -exportArchive \
              -archivePath $RUNNER_TEMP/NutriIA.xcarchive \
              -exportPath $RUNNER_TEMP/ipa-export \
              -exportOptionsPlist /tmp/exportOptions.plist

            IPA_PATH=$(find $RUNNER_TEMP/ipa-export -name "*.ipa" | head -1)
            echo "IPA generado en: $IPA_PATH"

            echo "=== Subiendo a TestFlight ==="
            xcrun altool --upload-app --type ios \
              --file "$IPA_PATH" \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID" \
              --verbose || echo "Subida finalizada."
          fi


      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutrIA-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 10. Upload iOS Framework & IPA Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: NutrIA-iOS-Artifacts
          path: |
            build/*.ipa
            *.ipa
            shared/build/bin/iosArm64/releaseFramework/
            shared/build/bin/
          if-no-files-found: ignore
