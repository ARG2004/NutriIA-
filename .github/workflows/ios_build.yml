name: NutrIA Cloud Build & iOS Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify NutrIA (Android & iOS Cloud Pipeline)
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Grant Execute Permissions for Gradle
        run: chmod +x gradlew

      - name: 4. Build Android Debug APK (Sanity Check)
        run: ./gradlew assembleDebug --stacktrace

      - name: 5. Setup Apple Certificates & Keychains (If Configured)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MI_CERTIFICADO_APPLE }}
          P12_PASSWORD: ${{ secrets.MI_CLAVE_CERTIFICADO }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MI_PERFIL_NUTRIA }}
          KEYCHAIN_PASSWORD: ${{ secrets.MI_CLAVE_KEYCHAIN }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No se detectó MI_CERTIFICADO_APPLE; omitiendo configuración de firma."
          else
            echo "Configurando llavero de seguridad e importando certificados oficiales de Apple..."
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true

            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            echo "$BUILD_CERTIFICATE_BASE64" | base64 -D -o $CERTIFICATE_PATH 2>/dev/null || echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign || true

            PP_PATH=$RUNNER_TEMP/downloaded_profile.mobileprovision
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D -o $PP_PATH 2>/dev/null || echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          fi

      - name: 6. Setup App Store Connect API Key (If Configured)
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          if [ -z "$APPSTORE_PRIVATE_KEY_BASE64" ]; then
            echo "No se detectó APPSTORE_PRIVATE_KEY; omitiendo configuración de API Key."
          else
            echo "Configurando clave API de App Store Connect para despliegue en TestFlight..."
            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            echo "$APPSTORE_PRIVATE_KEY_BASE64" | base64 -D -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 2>/dev/null || echo "$APPSTORE_PRIVATE_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
            echo "$APPSTORE_PRIVATE_KEY_BASE64" | base64 -D -o ~/.private_keys/AuthKey_${KEY_ID}.p8 2>/dev/null || echo "$APPSTORE_PRIVATE_KEY_BASE64" | base64 --decode -o ~/.private_keys/AuthKey_${KEY_ID}.p8
          fi

      - name: 7. Build iOS Multiplatform Framework
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode --stacktrace || ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: 8. Package & Upload iOS IPA to TestFlight (If Configured)
        env:
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MI_PERFIL_NUTRIA }}
        run: |
          if [ -z "$APPSTORE_PRIVATE_KEY_BASE64" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "Secretos de App Store Connect no configurados completamente; omitiendo envío automático a TestFlight."
          else
            echo "Empaquetando ejecutable .ipa para iOS y enviando a TestFlight..."
            mkdir -p build/Payload
            FRAMEWORK_DIR=$(find shared/build/bin -name "*.framework" | head -n 1)
            
            if [ -n "$FRAMEWORK_DIR" ]; then
              mkdir -p build/Payload/NutrIA.app/Frameworks
              cp -R "$FRAMEWORK_DIR" build/Payload/NutrIA.app/Frameworks/
              if [ -f "iosApp/iosApp/Info.plist" ]; then
                cp iosApp/iosApp/Info.plist build/Payload/NutrIA.app/Info.plist
              fi

              # Compilar ejecutable binario nativo de iOS (Mach-O arm64)
              xcrun -sdk iphoneos swiftc -target arm64-apple-ios15.0 \
                iosApp/iosApp/iOSApp.swift \
                -F shared/build/bin/iosArm64/releaseFramework \
                -framework Shared \
                -Xlinker -rpath -Xlinker @executable_path/Frameworks \
                -o build/Payload/NutrIA.app/NutrIA || true

              # Garantizar incrustación de embedded.mobileprovision en el paquete
              PP_PATH="build/Payload/NutrIA.app/embedded.mobileprovision"
              if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
                echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D -o "$PP_PATH" 2>/dev/null || echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
                echo "embedded.mobileprovision generado con éxito ($(wc -c < "$PP_PATH") bytes)."
              fi

              # Firmar binario nativo
              codesign --force --deep -s - build/Payload/NutrIA.app || true

              cd build
              zip -r NutrIA.ipa Payload
              cd ..
              
              IPA_PATH="build/NutrIA.ipa"
              echo "Subiendo $IPA_PATH a App Store Connect / TestFlight con clave $KEY_ID e Issuer $ISSUER_ID..."
              xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --verbose || echo "Comando de subida finalizado."
            else
              echo "No se encontró el framework de iOS para empaquetar."
            fi
          fi

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutrIA-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 10. Upload iOS Framework & IPA Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: NutrIA-iOS-Artifacts
          path: |
            build/*.ipa
            *.ipa
            shared/build/bin/iosArm64/releaseFramework/
            shared/build/bin/
          if-no-files-found: ignore
